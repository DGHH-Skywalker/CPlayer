name: Cplayer Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, for example v1.3.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: carbonv-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - name: Rebuild fixed DSP on canonical Linux toolchain
        run: node scripts/build-dynamics.mjs --check
      - name: Verify version tag and release tooling
        id: version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync, existsSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${pkg.version}`) throw new Error('Tag must match package.json version');
          if (!existsSync(`docs/releases/${tag}.md`)) throw new Error('Missing versioned release notes');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          JS
          node --test scripts/prepare-carbonv-release.test.mjs scripts/verify-dynamics.test.mjs

  windows:
    needs: prepare
    uses: ./.github/workflows/carbonv-windows.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v8
        with:
          pattern: Cplayer-Windows-x64-*
          path: release-assets
          merge-multiple: true
      - name: Verify and assemble release assets
        run: node scripts/prepare-carbonv-release.mjs release-assets release-upload
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != "true" ]; then
              echo "A published release already exists; refusing to replace its files"
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Cplayer $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-upload/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "docs/releases/$RELEASE_TAG.md"
