name: Cplayer Documentation

on:
  push:
    branches: [dev]
    paths: ["docs/**", "README*.md", "package.json", "pnpm-lock.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install documentation dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Cplayer documentation
        run: pnpm docs:build
      - uses: actions/upload-artifact@v7
        with:
          name: Cplayer-Documentation-${{ github.sha }}
          path: docs/.vitepress/dist
